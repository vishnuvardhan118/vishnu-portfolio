<!DOCTYPE html>
<html lang="en">
<head>
    <title>Certificates</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            min-height: 100vh;
            padding: 40px;
            background: linear-gradient(to bottom right, #0077b6, #023e8a);
            background-image: url(main.jpeg), linear-gradient(to bottom right, #0077b6, #023e8a);
            background-size: cover;
            background-position: center;
        }

        .head {
            width: 100%;
            text-align: center;
            margin-bottom: 40px;
            transition: all 0.3s ease;
        }

        .head:hover {
            transform: scale(1.05);
        }

        .head h1 {
            font-size: 3rem;
            color: #ffffff;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
        }

        .container {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* Exactly two columns */
            gap: 30px;
            padding-top: 20px;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 900px; /* Limit the width for better alignment */
        }

        .certificate-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            color: #ffffff;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
        }

        .certificate-box:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            background: rgba(255, 255, 255, 0.2);
        }

        .certificate-box img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin-bottom: 15px;
            transition: transform 0.3s ease; /* Smooth transition for image hover */
        }

        .certificate-box:hover img {
            transform: scale(1.1); /* Slight zoom-in on hover */
        }

        .certificate-title {
            font-weight: bold;
            font-size: 1.1rem;
            color: #ffba08;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5);
            transition: color 0.3s ease; /* Smooth color transition */
        }

        .certificate-box:hover .certificate-title {
            color: #ffdd57; /* Slightly lighter color on hover */
        }
    </style>
</head>
<body>
    <div class="head">
        <h1>Certificates</h1>
    </div>
    <div class="container">
        <div class="certificate-box">
            <img src="certificate.webp" alt="Python Certificate">
            <div class="certificate-title">Python Development</div>
        </div>
        <div class="certificate-box">
            <img src="certificate.webp" alt="Embedded System Certificate">
            <div class="certificate-title">Embedded System</div>
        </div>
        <div class="certificate-box">
            <img src="certificate.webp" alt="Web Development Certificate">
            <div class="certificate-title">Web Development</div>
        </div>
        <div class="certificate-box">
            <img src="certificate.webp" alt="EdX Certificate">
            <div class="certificate-title">EdX Certificate</div>
        </div>
    </div>
</body>
</html>
